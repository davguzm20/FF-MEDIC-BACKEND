name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Codium-ai/pr-agent@v0.27
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE_URL: https://api.deepseek.com/v1
          OPENAI_MODEL: deepseek-chat
          PR_ACTIONS: ${{ github.event_name == 'issue_comment' && 'auto_approve' || 'auto_review' }}
          PR_REVIEWER__SKIP_ON_SYNC: false
