name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci@localhost/ci
        run: npx prisma generate

      - run: pnpm lint

      - run: pnpm build

      - name: Create .env
        run: |
          echo "DATABASE_URL=postgresql://ci@localhost/ci" >> .env
          echo "JWT_SECRET=ci-jwt-secret" >> .env
          echo "JWT_REFRESH_SECRET=ci-jwt-refresh-secret" >> .env
          echo "JWT_EXPIRES_IN=15m" >> .env
          echo "JWT_REFRESH_EXPIRES_IN=7d" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "RESEND_API_KEY=re_ci-test" >> .env
          echo "MAIL_FROM=noreply@ci.example.com" >> .env
          echo "PORT=3000" >> .env
          echo "CORS_ORIGINS=http://localhost:3000" >> .env
          echo "BCRYPT_SALT_ROUNDS=10" >> .env
          echo "REDIS_BLACKLIST_TTL=86400" >> .env
          echo "RESET_TOKEN_TTL=300" >> .env

      - run: pnpm test
